[package]
name = "tpt-proto-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

# Required by `cargo fuzz` so it recognises this as a fuzz workspace member.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

tpt-proto-core = { path = "../crates/tpt-proto-core" }
tpt-proto-descriptor = { path = "../crates/tpt-proto-descriptor" }
tpt-proto-language = { path = "../crates/tpt-proto-language" }
tpt-proto-compiler = { path = "../crates/tpt-proto-compiler" }
tpt-proto-reflect = { path = "../crates/tpt-proto-reflect" }
tpt-proto-json = { path = "../crates/tpt-proto-json" }
tpt-proto-text = { path = "../crates/tpt-proto-text" }
tpt-proto-grpc = { path = "../crates/tpt-proto-grpc" }
base64 = "0.22"

[[bin]]
name = "binary_decoder"
path = "fuzz_targets/binary_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_decoder"
path = "fuzz_targets/json_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_parser"
path = "fuzz_targets/text_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "language_parser"
path = "fuzz_targets/language_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "descriptor_decoder"
path = "fuzz_targets/descriptor_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dynamic_decoder"
path = "fuzz_targets/dynamic_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_decode_message"
path = "fuzz_targets/codec_decode_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grpc_metadata"
path = "fuzz_targets/grpc_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grpc_status"
path = "fuzz_targets/grpc_status.rs"
test = false
doc = false
bench = false

[features]
# Default features deliberately do NOT pull in anything that requires a
# C/LLVM toolchain, so the crate also builds and runs as a portable corpus
# harness (and `cargo test` smoke test) on platforms where libFuzzer is
# unavailable (e.g. Windows MSVC). `cargo fuzz` builds the real libFuzzer
# entrypoints in `fuzz_targets/`, which is where `libfuzzer-sys` is actually
# linked.
default = []

# Keep this crate a standalone workspace so it can be built/tested on its own
# (cargo-fuzz also requires the fuzz package not to be a member of the parent
# workspace).
[workspace]
