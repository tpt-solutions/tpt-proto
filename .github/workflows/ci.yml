name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace

  test-tls:
    name: Test (tls feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test gRPC with TLS/mTLS (server-side termination + client CLI)
        run: cargo test -p tpt-proto-grpc --features tls

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fuzz:
    name: Fuzz (sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Fuzz build check (all targets compile under libFuzzer)
        working-directory: fuzz
        run: cargo +nightly fuzz build

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Check root workspace
        run: cargo deny check
      - name: Check fuzz workspace
        working-directory: fuzz
        run: cargo deny check

  conformance:
    name: Conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --bin tpt-conformance --bin tpt-conformance-testee
      - name: Run built-in conformance harness
        run: cargo run --release --bin tpt-conformance -- run
      - name: Upload conformance report (JSON)
        if: always()
        run: cargo run --release --bin tpt-conformance -- run --json > conformance-report.json
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json
      - name: Install protobuf build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build protobuf conformance runner
        env:
          PROTOBUF_VERSION: v6.31.1
        run: |
          git clone --depth 1 --branch "$PROTOBUF_VERSION" --recurse-submodules --shallow-submodules \
            https://github.com/protocolbuffers/protobuf.git "$RUNNER_TEMP/protobuf"
          cmake -S "$RUNNER_TEMP/protobuf" -B "$RUNNER_TEMP/protobuf-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -Dprotobuf_BUILD_CONFORMANCE=ON -Dprotobuf_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/protobuf-build" --target conformance_test_runner
          echo "CONFORMANCE_TEST_RUNNER=$RUNNER_TEMP/protobuf-build/conformance_test_runner" >> "$GITHUB_ENV"
      - name: Run official conformance suites
        env:
          PROTOBUF_VERSION: v6.31.1
        run: bash conformance/run_conformance.sh
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: conformance/results/latest.md
