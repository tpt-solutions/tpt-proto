[package]
name = "tpt-proto-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "gRPC protocol, server, and client runtime"

[features]
default = []
# Enables TLS client support in the `tpt-grpc` debug CLI. Pulls in `rustls` /
# `tokio-rustls` and is off by default so the workspace builds without those
# optional native dependencies.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]

[dependencies]
tpt-proto-core = { workspace = true }
tpt-proto-descriptor = { workspace = true }
tpt-proto-codegen-rust = { workspace = true }
tpt-proto-reflect = { workspace = true }
tpt-proto-wkt = { workspace = true }
tpt-proto-json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
h2 = { workspace = true }
http = { workspace = true }
tokio = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
serde_json = { workspace = true }
hex = "0.4"
rustls = { version = "0.23", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }

[dev-dependencies]
tpt-proto-core = { workspace = true }
tpt-proto-compiler = { workspace = true }
tpt-proto-language = { workspace = true }
