[dependencies]
thiserror = { workspace = true }
bytes = { workspace = true, optional = true }

[features]
default = []
# Re-export `bytes::Bytes` for shared/sliced buffer support.
bytes = ["dep:bytes"]

[dev-dependencies]
proptest = "1"

