[package]
name = "tpt-proto-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Binary wire format runtime (varint, tags, scalar codecs)"
readme = "../../README.md"
keywords = ["protobuf", "wire-format", "varint", "serialization"]
