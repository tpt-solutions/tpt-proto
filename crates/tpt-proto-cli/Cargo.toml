[package]
name = "tpt-proto-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command line interface for the tpt-proto toolchain"

[dependencies]
tpt-proto-language = { workspace = true }
tpt-proto-compiler = { workspace = true }
tpt-proto-codegen-rust = { workspace = true }
tpt-proto-descriptor = { workspace = true }
tpt-proto-core = { workspace = true }
tpt-proto-json = { workspace = true }
tpt-proto-text = { workspace = true }
tpt-proto-reflect = { workspace = true }
tpt-proto-lint = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
hex = "0.4"

[dev-dependencies]
tpt-proto-core = { workspace = true }
